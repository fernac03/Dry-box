# Board: Wemos D1 Mini (ESP8266) (Wemos)
# Definition: definitions/boards/d1_mini/manifest.yaml

esphome:
  name: drybox-01
  friendly_name: Drybox-01

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: "qqy7JoWdcoGzmGPNOi1LBMaanPcrjkxq846kFNLHYks="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Drybox-01 Fallback Hotspot
    password: "sZNlrJR5bu9H"

captive_portal:

# Configuração do barramento I2C nos pinos padrão do D1 Mini (GPIO4=D2, GPIO5=D1)
i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

# Configuração da fonte para o display OLED
font:
  - file: "gfonts://Roboto"
    id: font_roboto
    size: 12

sensor:
  - platform: sht4x
    temperature:
      name: "Temperatura da Drybox 01"
      id: drybox_temp
    humidity:
      name: "Umidade da Drybox 01"
      id: drybox_hum
    update_interval: 60s

# Configuração do Display OLED 0.91" (128x32)
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    address: 0x3C
    update_interval: 5s
    lambda: |-
      // Exibe a Temperatura na primeira linha
      if (id(drybox_temp).has_state()) {
        it.printf(0, 0, id(font_roboto), "Temp: %.1f *C", id(drybox_temp).state);
      } else {
        it.print(0, 0, id(font_roboto), "Temp: Lendo...");
      }
      
      // Exibe a Umidade na segunda linha
      if (id(drybox_hum).has_state()) {
        it.printf(0, 16, id(font_roboto), "Umid: %.1f %%", id(drybox_hum).state);
      } else {
        it.print(0, 16, id(font_roboto), "Umid: Lendo...");
      }
